name: CI/CD Pipeline to Azure

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job 1: Build và Test Code .NET
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DoQuangThang_SE1885_A01_BE/Presentation/CoreAPI.csproj
        working-directory: .

      - name: Build
        run: dotnet build DoQuangThang_SE1885_A01_BE/Presentation/CoreAPI.csproj --configuration Release --no-restore
        working-directory: .

  # Job 2: Đóng gói Docker và đẩy lên Docker Hub
  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./DoQuangThang_SE1885_A01_BE/Presentation/Dockerfile
          push: true
          # Sử dụng biến từ Secret để linh hoạt
          tags: ${{ secrets.DOCKER_USERNAME }}/coreapi:latest

  # Job 3: Triển khai lên Azure (Đã sửa lại hoàn toàn)
  deploy:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          # THAY THẾ: 'thang-coreapi' bằng tên bạn đặt trên Azure Portal
          app-name: 'thang-coreapi' 
          # Sử dụng file Publish Profile đã lưu trong GitHub Secrets
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          # Chỉ định Image mà Azure cần kéo về
          images: '${{ secrets.DOCKER_USERNAME }}/coreapi:latest'
