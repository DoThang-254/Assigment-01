# Using for http
# --- GIAI ĐOẠN 1: TỐI ƯU HỆ THỐNG (SYSTEM LEVEL) ---
# Tự động nhận diện số nhân CPU của máy để mở số luồng xử lý tương ứng
# Giúp Nginx không bị nghẽn khi có hàng ngàn request cùng lúc
worker_processes auto; 

events {
    # Mỗi luồng xử lý (worker) được phép mở tối đa 5000 kết nối
    # Tổng kết nối chịu tải tối đa = worker_processes * worker_connections
    worker_connections 5000;


    # Cho phép Nginx chấp nhận tất cả các kết nối mới đang chờ cùng một lúc
    # Giảm độ trễ khi có một "cơn lốc" request ập đến
    multi_accept on;
}

http {
    # --- CẤU HÌNH RATE LIMITING (Cho HTTP) ---
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;
    limit_req_status 429;

    # --- GIAI ĐOẠN 2: ĐIỀU PHỐI TẢI (LOAD BALANCING) ---

    upstream backend_api {
        # 'api' là tên service trong docker-compose. Nếu bạn scale lên 3, 
        # Docker DNS sẽ tự động trả về IP của cả 3 container này.
        
        # max_fails=5 & fail_timeout=10s: Nếu 1 container lỗi 5 lần liên tiếp,
        # Nginx sẽ "cạch mặt" nó trong 10 giây rồi mới thử cho nó cơ hội quay lại.
        server api:8080 max_fails=5 fail_timeout=10s;

        # Giữ sẵn 100 kết nối TCP mở với các container API (Keepalive)
        # Giúp request sau chạy luôn, không cần tốn thời gian "bắt tay" TCP lại từ đầu
        keepalive 100;
    }

    server {
        listen 80; # Lắng nghe ở cổng 80 (cổng web mặc định)

        # signalR 
        location /hubs/notifications {
            proxy_pass http://backend_api;

            # Cấu hình BẮT BUỘC cho WebSocket (SignalR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            # Đảm bảo dữ liệu luôn được truyền trực tiếp và ngay lập tức
            proxy_cache_bypass $http_upgrade;

            # Mở rộng timeout vì WebSocket thường giữ kết nối lâu
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
        # end signalr

        location / {
            # --- ÁP DỤNG RATE LIMIT (Cho HTTP) ---
            limit_req zone=mylimit burst=5 nodelay;

            # Đẩy toàn bộ request vào cụm backend_api đã định nghĩa ở trên
            proxy_pass http://backend_api;

            # --- GIAI ĐOẠN 3: TỐI ƯU KẾT NỐI (CONNECTION) ---

            # Bắt buộc dùng HTTP 1.1 và xóa header Connection để tính năng 'keepalive' hoạt động            
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # --- GIAI ĐOẠN 4: CHUYỂN TIẾP THÔNG TIN (HEADERS) ---

            # CHO REAL-TIME (SIGNALR/WEBSOCKET)
            # Giúp API phía sau nhận biết được IP thật của người dùng thay vì IP của Nginx, hỗ trợ việc định danh user trong các nhóm (Groups) của SignalR.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade"; 

            # Giữ nguyên tên miền gốc mà người dùng gửi lên
            proxy_set_header Host $host;
            # Gửi IP thật của người dùng xuống cho API (nếu không API sẽ chỉ thấy IP của Nginx)
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Gửi thông tin giao thức (http hay https) xuống cho API
            proxy_set_header X-Forwarded-Proto $scheme;

            # --- GIAI ĐOẠN 5: KIỂM SOÁT THỜI GIAN (TIMEOUTS) ---
            
            # Thời gian chờ tối đa để kết nối tới API (Quá 3 giây là bỏ qua)
            proxy_connect_timeout 3s; 
            # Thời gian chờ API xử lý và trả về dữ liệu (Quá 5 giây là coi như lỗi)
            proxy_read_timeout 5s;    
            # Thời gian chờ để gửi dữ liệu từ Nginx lên API
            proxy_send_timeout 5s;

            # --- GIAI ĐOẠN 6: CƠ CHẾ CHỊU LỖI (FAILOVER) ---
            
            # Nếu server hiện tại bị: Lỗi kết nối, Timeout, hoặc báo lỗi 50x...
            # Nginx sẽ NGAY LẬP TỨC chuyển request đó sang server khác còn sống.
            # Người dùng sẽ không thấy thông báo lỗi, chỉ thấy hơi chậm một chút.
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        }
    }
}
