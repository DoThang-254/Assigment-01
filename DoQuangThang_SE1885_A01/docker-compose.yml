#using http
services:
  api:
    build:
      context: .
      dockerfile: DoQuangThang_SE1885_A01_BE/Presentation/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__MyCnn=Server=host.docker.internal;Database=FUNewsManagement;User Id=sa;Password=123;TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
    deploy:
      replicas: 3
      update_config:
        order: start-first  # Bật mới trước khi tắt cũ
        parallelism: 1
      restart_policy:
        condition: on-failure # Nếu app crash hoặc healthcheck fail, Docker tự khởi động lại con mới
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/localhost/8080' || exit 1"]      
      interval: 10s
      timeout: 5s
      retries: 3 # Kiểm tra nếu lỗi đủ 3 lần => Unhealthy => restart_policy => check container nào hỏng => Kill => dùng image gốc (đã được tạo ra từ docker file) => tạo 1 container mới 
      start_period: 10s
    ports:
      - "8080"
    networks:
      - app-network

  # Realtime
  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"  
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
